apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-application
  namespace: devops-application
spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-application

  template:
    metadata:
      labels:
        app: devops-application

    spec:
      containers:
        - name: devops-application
          image: shubham0797/devops-application:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8082

          env:
            - name: PORT
              value: "8082"

            - name: NODE_ENV
              value: "production"

            - name: DB_HOST
              value: "postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
